name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Unit tests (no API calls)
        run: pytest

      - name: Score the saved reports
        run: |
          python -m triage baseline --dataset datasets/v1 --out results/baseline
          python -m triage score --dataset datasets/v1 --predictions results/baseline
